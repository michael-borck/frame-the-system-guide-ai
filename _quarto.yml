project:
  type: book
  output-dir: _book
  resources:
    - LICENSE

book:
  title: "Frame the System, Guide the AI"
  subtitle: "Systems Analysis and Design in the AI Era"
  author: "Michael Borck"
  date: "last-modified"
  license: "CC BY 4.0 International"
  description: "A practical guide to framing problems, analysing requirements, modelling systems and defending design decisions when AI can draft, build and operate more of the system."
  cover-image: cover.png
  favicon: favicon.svg
  site-url: https://michael-borck.github.io/frame-the-system-guide-ai
  repo-url: https://github.com/michael-borck/frame-the-system-guide-ai
  repo-branch: main
  repo-actions: [edit, issue]

  chapters:
    - index.qmd
    - copyright.qmd

    - part: "Frame the Problem"
      chapters:
        - chapters/01-brief-is-not-system.qmd
        - chapters/02-stakeholders.qmd
        - chapters/03-scope-context.qmd

    - part: "Requirements as Evidence"
      chapters:
        - chapters/04-functional.qmd
        - chapters/05-non-functional.qmd
        - chapters/06-checkable.qmd

    - part: "Models and Decisions"
      chapters:
        - chapters/07-models.qmd
        - chapters/08-options.qmd

    - part: "Defend and Hand Over"
      chapters:
        - chapters/09-traceability.qmd
        - chapters/10-handover.qmd

  appendices:
    - appendices/artefact-templates.qmd
    - appendices/ai-system-checklist.qmd
    - acknowledgments.qmd
    - about-author.qmd

  page-navigation: true
  sidebar:
    style: docked
    search: true
    collapse-level: 2
  other-links:
    - text: Download PDF
      icon: file-pdf
      href: /frame-the-system-guide-ai.pdf
    - text: Download EPUB
      icon: book
      href: /frame-the-system-guide-ai.epub
    - text: GitHub
      icon: github
      href: https://github.com/michael-borck/frame-the-system-guide-ai
    - text: All Books
      icon: collection
      href: https://books.borck.education

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: book-design.css
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 2
    highlight-style: github
  pdf:
    pdf-engine: lualatex
    fontsize: 11pt
    linestretch: 1.08
    include-in-header: [pdf-header.tex, book-design.tex]
    include-before-body:
      - copyright-page.tex
    documentclass: book
    toc: true
    toc-depth: 1
    number-sections: true
    geometry:
      - paperwidth=6in
      - paperheight=9in
      - inner=1in
      - outer=0.625in
      - top=0.75in
      - bottom=0.75in
  epub:
    epub-cover-image: cover.png
    css: [book-design-epub.css]
    toc: true
    toc-depth: 1
